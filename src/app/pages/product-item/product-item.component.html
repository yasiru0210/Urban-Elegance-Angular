<div class="product-card">
  <div class="product-image-container">
    <img [src]="productInfo?.image" 
         [alt]="productInfo?.title" 
         class="product-image"
         loading="lazy">
    <div class="product-overlay">
      <button class="btn btn-primary btn-sm quick-view-btn">
        Quick View
      </button>
    </div>
  </div>

  <div class="product-info">
    <div class="product-category">
      {{productInfo?.category | titlecase}}
    </div>
    
    <h5 class="product-title">
      {{productInfo?.title}}
    </h5>
    
    <p class="product-description">
      {{productInfo?.description | slice:0:100}}{{productInfo?.description?.length > 100 ? '...' : ''}}
    </p>
    
    <div class="product-rating">
      <div class="stars">
        <span *ngFor="let star of getStars(productInfo?.rating?.rate)" 
              class="star" 
              [class.filled]="star <= productInfo?.rating?.rate">
          ★
        </span>
      </div>
      <span class="rating-text">
        {{productInfo?.rating?.rate}} ({{productInfo?.rating?.count}} reviews)
      </span>
    </div>
    
    <div class="product-footer">
      <div class="product-price">
        ${{productInfo?.price | number:'1.2-2'}}
      </div>
      
      <div class="product-actions">
        <button type="button" class="btn btn-outline-secondary btn-sm me-2">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 2.748l-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.838-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"/>
          </svg>
        </button>
        
        <button type="button" class="btn btn-primary btn-sm">
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</div>
